services:
  db:
    image: postgres:16
    container_name: pernamboxDB
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - pernambox_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
volumes:
  pernambox_pgdata: