services:
  db:
    image: postgres:16
    container_name: pernamboxDB
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - pernambox_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - pernambox-net
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ] # persiste os dados
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - pernambox_redis_data:/data
    networks:
      - pernambox-net
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: senha123
    volumes:
      - ./minio-data:/data
    networks:
      - pernambox-net
    # Porta de acesso interna ("ports" em dev e "expose" em prod)
    expose:
      - "9000"
    ports:
      - "9100:9000"
#     Acesso ao minio front (opcional)
      - "9101:9001"

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pernambox-net
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    read_only: false
    restart: unless-stopped

  loki:
      image: grafana/loki:2.9.0
      container_name: loki
      command: -config.file=/etc/loki/loki-config.yaml
      user: "0"
      volumes:
        - ./observability/loki-config.yml:/etc/loki/loki-config.yaml
        - ./loki_data:/loki
      networks:
        - pernambox-net
      security_opt:
        - no-new-privileges:true
      read_only: false
      restart: unless-stopped
      expose:
        - "3100"

  promtail:
      image: grafana/promtail:2.9.0
      container_name: promtail
      command: -config.file=/etc/promtail/config.yml
      volumes:
        - /var/log/spring/:/var/log/spring/:ro
        - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      networks:
        - pernambox-net
      security_opt:
        - no-new-privileges:true
      restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
    volumes:
      - ./grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - pernambox-net
  backend:
    build: .
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - pernambox-net
volumes:
  pernambox_pgdata:
  pernambox_redis_data:
  grafana_data:
  loki_data:
networks:
  pernambox-net:
    driver: bridge