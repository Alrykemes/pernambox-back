spring.application.name=Pernambox

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG

spring.jpa.database=postgresql

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=Pernambox-Backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.http.server.requests.name=http_server_requests

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}