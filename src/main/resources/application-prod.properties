# DataBase
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# "localhost" desenvolvendo local e "db" pra prod (por causa dos conteiners).
spring.datasource.url=${POSTGRES_URL}

# Infra/Security
infra.security.jwt=${JWT_SECRET}

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TTLS}

# Redis
# "localhost" desenvolvendo local e "redis" pra prod (por causa dos conteiners).
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}